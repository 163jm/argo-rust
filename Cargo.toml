[package]
name = "mini-cloudflared"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mini-cloudflared"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
rustls = "=0.21.12"
webpki-roots = "=0.25.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
rand = "=0.8.5"
url = "=2.4.1"
getrandom = "=0.2.17"
base64 = "0.21"

[dependencies.clap]
version = "=4.4.18"
features = ["derive", "env"]

[dependencies.uuid]
version = "=1.6.1"
features = ["v4"]
