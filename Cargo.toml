[package]
name = "mini-cloudflared"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "mini-cloudflared"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
rand = "=0.8.5"
url = "=2.4.1"
getrandom = "=0.2.17"
base64 = "0.21"
rustls = "=0.21.12"
webpki-roots = "=0.25.4"
tokio-rustls = "=0.24.1"
h2 = "0.3"
http = "0.2"
httparse = "1"
dirs-next = "2"
hex = "0.4"

rustls-native-certs = "0.6"
rustls-pemfile = "1"

[dependencies.clap]
version = "=4.4.18"
features = ["derive", "env"]

[dependencies.uuid]
version = "=1.6.1"
features = ["v4"]
