name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: mini-cloudflared-linux-amd64

          # Linux arm64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: mini-cloudflared-linux-arm64

          # macOS amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mini-cloudflared-macos-amd64

          # macOS arm64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mini-cloudflared-macos-arm64

          # Windows amd64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mini-cloudflared-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux cross-compile: install musl + cross toolchain
      - name: Install musl tools (Linux amd64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross-compile tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y musl-tools
          # Install cross via cargo for arm64 cross-compilation
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux arm64 via cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (all other targets)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      # Rename binary to artifact name
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/mini-cloudflared ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/mini-cloudflared.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## mini-cloudflared ${{ github.event.inputs.tag }}

            ### 下载

            | 平台 | 架构 | 文件 |
            |------|------|------|
            | Linux  | amd64 | `mini-cloudflared-linux-amd64` |
            | Linux  | arm64 | `mini-cloudflared-linux-arm64` |
            | macOS  | amd64 | `mini-cloudflared-macos-amd64` |
            | macOS  | arm64 (Apple Silicon) | `mini-cloudflared-macos-arm64` |
            | Windows | amd64 | `mini-cloudflared-windows-amd64.exe` |

            ### 快速使用
            ```bash
            # Linux/macOS — 赋予执行权限
            chmod +x mini-cloudflared-linux-amd64

            # 快速隧道（无需账号）
            ./mini-cloudflared-linux-amd64 tunnel --quick --url http://localhost:8080

            # 使用 Token 的命名隧道
            ./mini-cloudflared-linux-amd64 tunnel --url http://localhost:8080 --token <TOKEN>

            # 本地反向代理
            ./mini-cloudflared-linux-amd64 proxy --port 8080 --target http://localhost:3000
            ```
